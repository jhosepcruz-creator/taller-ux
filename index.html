<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Notas Accesible</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="tarjeta">
    <img src="img/banner.png" alt="Estudiantes en el laboratorio de desarrollo de software">
    <h1>Mi Gestor de Notas</h1>
    <p class="ayuda">Organiza tus tareas y recordatorios diarios de forma sencilla.</p>

    <form id="form-nota" novalidate>
      <fieldset>
        <legend>1. Crear nueva nota</legend>
        
        <label for="titulo-nota">Título de la nota</label>
        <input id="titulo-nota" type="text" placeholder="Ej. Comprar insumos" required autocomplete="off">

        <label for="contenido-nota">Detalle o contenido</label>
        <textarea id="contenido-nota" rows="3" placeholder="Escribe aquí los detalles..." required></textarea>
      </fieldset>

      <p id="mensaje-estado" class="mensaje" role="status"></p>

      <div class="acciones">
        <button type="submit" class="boton-principal">Guardar nota</button>
        <button type="button" id="btn-cancelar" class="boton-secundario">Limpiar campos</button>
      </div>
    </form>

    <section class="seccion-notas">
      <h2>2. Mis Notas Guardadas</h2>
      <ul id="lista-notas" class="lista-notas">
        <!-- Las notas se cargarán dinámicamente -->
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
